<!--
  QB BrandOS · HTML head snippet
  Drop everything inside <head> on every page of quantumbranding.ai

  Asset locations assumed:
    /img/brand/web/   for favicons, app icons, manifest
    /img/brand/og/    for Open Graph share image

  Adjust the paths if you place the files elsewhere.
-->

<!-- Title and description -->
<title>Quantum Branding · From idea to orbit.</title>
<meta name="description" content="QB BrandOS turns one founder, one idea, and zero assets into a complete brand running across twenty specialised agents. From idea to orbit.">

<!-- Theme -->
<meta name="theme-color" content="#2D1521">
<meta name="color-scheme" content="light">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="/img/brand/web/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/brand/web/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/brand/web/favicon-16x16.png">
<link rel="shortcut icon" href="/img/brand/web/favicon.ico">

<!-- Apple Touch Icon (iOS home screen) -->
<link rel="apple-touch-icon" sizes="180x180" href="/img/brand/web/apple-touch-icon.png">

<!-- Safari pinned tab (monochrome) -->
<link rel="mask-icon" href="/img/brand/web/safari-pinned-tab.svg" color="#2D1521">

<!-- PWA manifest -->
<link rel="manifest" href="/img/brand/web/site.webmanifest">

<!-- Open Graph (Facebook, LinkedIn, Slack, WhatsApp, iMessage) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Quantum Branding">
<meta property="og:title" content="Quantum Branding · From idea to orbit.">
<meta property="og:description" content="The brand operating system. Twenty agents, six phases, one Brand Profile.">
<meta property="og:url" content="https://quantumbranding.ai/">
<meta property="og:image" content="https://quantumbranding.ai/img/brand/og/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Quantum Branding wordmark with the positioning line: From idea to orbit.">
<meta property="og:locale" content="en_US">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Quantum Branding · From idea to orbit.">
<meta name="twitter:description" content="The brand operating system. Twenty agents, six phases, one Brand Profile.">
<meta name="twitter:image" content="https://quantumbranding.ai/img/brand/og/og-image.png">
<meta name="twitter:image:alt" content="Quantum Branding wordmark with the positioning line: From idea to orbit.">
<!-- Add when account exists: <meta name="twitter:site" content="@yourhandle"> -->

<!-- Canonical URL (update per page) -->
<link rel="canonical" href="https://quantumbranding.ai/">
