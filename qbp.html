<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>QBP · QB BrandOS</title>

<link rel="icon" href="/img/brand/web/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/img/brand/web/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,50..100,0..1&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,50..100,0..1&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap"></noscript>

<link rel="stylesheet" href="/css/qb-tokens.css">
<link rel="stylesheet" href="/css/qb-components.css">

<style>
  html, body {
    margin: 0;
    background: var(--cream, #FBF5E6);
    color: var(--ink, #2D1521);
    font-family: var(--font-body, 'Inter', system-ui, sans-serif);
    -webkit-text-size-adjust: 100%;
    line-height: 1.5;
  }
  *, *::before, *::after { box-sizing: border-box; }
  img, svg, video { display: block; max-width: 100%; }
  main#qbp-root { min-height: 70vh; }
  .qb-toast {
    position: fixed;
    left: 50%; bottom: var(--space-l);
    transform: translateX(-50%);
    background: var(--ink); color: var(--cream);
    padding: 0.6em 1.2em;
    border-radius: var(--radius-pill);
    font-family: var(--font-mono);
    font-size: var(--step--2);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity var(--duration-pill) var(--ease-pill);
    pointer-events: none;
    z-index: 200;
  }
  .qb-toast.is-visible { opacity: 1; }
  /* Hide the toast on print. */
  @media print { .qb-toast { display: none !important; } }
</style>
</head>
<body>
<main id="qbp-root" aria-live="polite"></main>
<div id="qb-toast" class="qb-toast" aria-live="polite"></div>

<script src="/qb-cloud.js"></script>
<script type="module">
import { renderQbp, renderQbpLoading, renderQbpError } from '/js/qb-qbp.js';
import { createPaywallModal } from '/js/qb-components.js';

const root = document.getElementById('qbp-root');
const toast = document.getElementById('qb-toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('is-visible');
  setTimeout(() => toast.classList.remove('is-visible'), 1800);
}
function redirectToAuth() {
  const next = encodeURIComponent('/qbp');
  window.location.replace(`/signal-scan.html?reason=signin&return_to=${next}`);
}

const PAID_TIERS = new Set(['starter','pro','agency','atelier']);

let lastTier = 'free';
let lastFoundationLockedAt = null;

async function exportQbp() {
  if (!window.QB || !window.QB.isAuthed()) { redirectToAuth(); return; }
  const tier = lastTier;
  if (!PAID_TIERS.has(tier)) {
    showPaywallModal();
    return;
  }
  showToast('Preparing your QBP…');
  try {
    const session = window.QB.getSession();
    const res = await fetch('/api/qbp/export', {
      method: 'POST',
      headers: { Authorization: `Bearer ${session.token}` },
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 402) {
      showPaywallModal();
      return;
    }
    if (!res.ok || !data.signed_url) {
      showToast('Export failed');
      return;
    }
    // The export ships JSON in Chapter 1 (PDF deferred). Surface that
    // to the user honestly so the download is not surprising.
    const note = data.format === 'json'
      ? 'Downloading as JSON (PDF format coming soon).'
      : 'Downloading…';
    showToast(note);
    setTimeout(() => { window.location.href = data.signed_url; }, 600);
  } catch (_) {
    showToast('Export failed');
  }
}

function showPaywallModal() {
  const overlay = createPaywallModal({
    reason: 'qbp_export',
    eyebrow: 'Locked',
    headline: 'Open QBP export.',
    body: 'Starter tier gives you the full QBP as a downloadable file.',
    price: 'Starter, $97 / month. Cancel anytime.',
    primaryCta: 'Upgrade to Starter',
    secondaryCta: 'Not now',
    onPrimary:   () => { window.location.href = '/paywall?reason=qbp_export'; },
    onSecondary: () => { overlay.remove(); },
  });
  document.body.appendChild(overlay);
}

async function load() {
  renderQbpLoading(root);

  if (!window.QB || !window.QB.isAuthed || !window.QB.isAuthed()) {
    redirectToAuth();
    return;
  }
  const session = window.QB.getSession();

  let res, data;
  try {
    res = await fetch('/api/qbp', { headers: { Authorization: `Bearer ${session.token}` } });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    renderQbpError(root, e);
    return;
  }
  if (res.status === 401) { redirectToAuth(); return; }
  if (!res.ok) {
    renderQbpError(root, new Error(`HTTP ${res.status}: ${data?.error || 'unknown'}`));
    return;
  }

  // Server-authoritative tier from /api/qbp. Never read session.tier;
  // localStorage lags behind tier flips after Stripe upgrade.
  const tier = String(data.tier || 'free').toLowerCase();
  lastTier = tier;
  lastFoundationLockedAt = data.foundation_locked_at || null;

  renderQbp(root, data.qbp || {}, {
    foundationLockedAt: data.foundation_locked_at,
    lastUpdated: data.last_updated,
    tier,
    canExport: PAID_TIERS.has(tier),
    onExportClick: exportQbp,
  });
}

document.addEventListener('DOMContentLoaded', load);
if (document.readyState !== 'loading') load();
</script>
</body>
</html>
